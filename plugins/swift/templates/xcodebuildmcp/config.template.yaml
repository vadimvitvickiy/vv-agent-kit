# Template for .xcodebuildmcp/config.yaml — the defaults shared by the
# `xcodebuildmcp` CLI and the MCP server.
#
# Generate the real file with `scripts/setup-tooling.sh`. Only the template is
# committed: every value the script fills in is machine-specific, and a committed
# config.yaml resolves to another developer's paths.
#
# derivedDataPath is the reason this file exists. Left unset, xcodebuildmcp builds
# into its own isolated store under ~/Library/Developer/XcodeBuildMCP/workspaces/
# — a cold build, and a second multi-GB cache nothing else ever reads. Measured on
# one SDK checkout: 3.53 GB accumulated there before the binding was added, and
# not one byte written after.
#
# derivedDataPath alone is not enough. Passing it explicitly moves the module and
# compilation caches INSIDE that folder, where Xcode and a plain xcodebuild keep
# them one level up, beside it. The compiler arguments then differ, and every
# switch between xcodebuildmcp and anything else recompiles the whole project —
# measured on an iOS app: 26 of 26 Swift files, on every alternation. The five
# cache settings in extraArgs put them back where Xcode has them; with all five,
# alternating compiled nothing. MODULE_CACHE_DIR and SDK_EXPLICIT_MODULES_OUTPUT_PATH
# alone still recompiled everything.
#
# simulatorId is deliberately absent — UDIDs are regenerated per machine and per
# Xcode install. simulatorName is re-resolved to this machine's UDID at runtime.
schemaVersion: 1

# The CLI reports usage to Sentry by default. Off here because an agent invokes it
# far more often than a human would, and the traffic is not the project's to send.
sentryDisabled: true

# Narrower than the default set: this gates what the MCP SERVER exposes, and every
# workflow it exposes costs tool-listing context in every session. The CLI is
# unaffected and can still invoke anything. Add `device`, `macos`, `swift-package`
# or `debugging` when the project actually needs them as MCP tools.
enabledWorkflows:
  - simulator
  - simulator-management
  - ui-automation

sessionDefaults:
  @PROJECT_KEY@: @PROJECT_PATH@
  scheme: @SCHEME@
  simulatorName: @SIMULATOR_NAME@
  simulatorPlatform: iOS Simulator
  derivedDataPath: @DERIVED_DATA_PATH@
  # The same two flags scripts/build.sh passes. Xcode 26 re-validates macro and
  # package-plugin fingerprints and can hang; more importantly, a build with
  # different flags is a different build description, and two of those sharing one
  # DerivedData evict each other on every alternation.
  #
  # The rest restore Xcode's cache locations — see the header. They are values
  # Xcode computes anyway, so they do not make this a different build.
  extraArgs:
    - -skipMacroValidation
    - -skipPackagePluginValidation
    - COMPILATION_CACHE_CAS_PATH=@DERIVED_DATA_ROOT@/CompilationCache.noindex
    - MODULE_CACHE_DIR=@DERIVED_DATA_ROOT@/ModuleCache.noindex
    - SDK_EXPLICIT_MODULES_OUTPUT_PATH=@DERIVED_DATA_ROOT@/SDKExplicitPrecompiledModules
    - CLANG_MODULES_BUILD_SESSION_FILE=@DERIVED_DATA_ROOT@/ModuleCache.noindex/Session.modulevalidation
    - SDK_STAT_CACHE_DIR=@DERIVED_DATA_ROOT@

# For a project that ships more than one platform, replace `sessionDefaults` with
# named profiles and select one per command with `--profile <name>`:
#
#   sessionDefaultsProfiles:
#     ios:   { ...the block above... }
#     tvos:  { ...same, with a tvOS scheme and simulatorPlatform: tvOS Simulator }
#   activeSessionDefaultsProfile: ios
