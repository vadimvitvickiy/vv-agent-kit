# Starts permissive on purpose: a lint config that fails an existing codebase on
# first run gets disabled rather than fixed. Tighten once the baseline is clean.

excluded:
  - .build
  - Carthage
  - Pods
  - DerivedData
  - "**/*.generated.swift"
  - "**/*.pb.swift"
  - "**/*.grpc.swift"

disabled_rules:
  - todo                    # TODOs are kept deliberately; see vvkit:writing-comments
  - trailing_whitespace     # the editor handles this
  - type_name
  - identifier_name

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1500

function_body_length:
  warning: 60
  error: 150

type_body_length:
  warning: 400
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 30

force_cast: warning
force_try: warning
force_unwrapping: warning
