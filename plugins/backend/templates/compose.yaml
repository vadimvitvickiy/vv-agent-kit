# Local development dependencies. Generated by /vvkit:scripts — yours now.
#
#   scripts/db.sh up        start Postgres and wait until it accepts connections
#   scripts/db.sh migrate   apply migrations/ with golang-migrate, run in a container
#
# No `version:` key: Compose v2 ignores it and warns. Redis starts only with
# `--profile redis`, so a service that does not use it does not pay for it.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker and
      # declare the volume at /var/lib/postgresql. Mounting the pre-18 path,
      # /var/lib/postgresql/data, leaves the real data in an anonymous volume that
      # a container recreate throws away.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Runs on the compose network, so it reaches the database as `db` and needs no
  # local install and no host networking. Swap for dbmate or goose if the project
  # uses one; scripts/db.sh calls this service and nothing else.
  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
