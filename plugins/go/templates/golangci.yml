# golangci-lint v2. Generated by /vvkit:scripts — safe to edit, it is yours now.
#
# The linter set is the overlap of maratori's golden config, Prometheus,
# HashiCorp Consul and kubernetes-sigs/cluster-api, plus the leak checkers that
# matter in a service. Left out on purpose, because curated configs call them
# noisy or false-positive-prone: wsl, nlreturn, exhaustruct, varnamelen,
# gochecknoglobals, contextcheck, err113.
version: "2"

run:
  timeout: 5m

linters:
  default: standard     # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint         # errors compared with == or type-asserted instead of errors.Is/As; wrong %w usage
    - bodyclose         # an unclosed HTTP response body leaks the connection
    - noctx             # an HTTP request built without a context, so without a deadline
    - sqlclosecheck     # sql.Rows or Stmt never closed
    - rowserrcheck      # rows.Err() never checked — a silently truncated result set
    - gosec             # security-relevant patterns: injection, weak crypto, file permissions
    - gocritic          # a broad set of bug and simplification checks
    - revive            # the maintained golint replacement: naming, doc comments, error strings
    - unconvert         # conversions to the type a value already has
    - unparam           # parameters every caller passes the same value for
    - misspell          # typos in comments and strings

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [bodyclose, noctx, gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  # settings:
  #   goimports:
  #     local-prefixes: [{{MODULE_PATH}}]   # group this module's imports last
